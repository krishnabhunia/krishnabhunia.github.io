name: Documentation and source checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate documentation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,urllib.parse
          p=Path("docs/PROJECT_GUIDE.md"); s=p.read_text(encoding="utf-8-sig")
          assert s.count("~~~")%2==0, "Unbalanced diagram/code fences"
          assert s.count("~~~mermaid")>=3, "Expected three Mermaid diagrams"
          assert "docs/PROJECT_GUIDE.md" in Path("README.md").read_text(encoding="utf-8-sig")
          for x in re.findall(r"\]\(([^)]+)\)",s):
           t=x.split("#")[0].split("?")[0]
           if t and not t.startswith(("http://","https://","mailto:","#")):
            assert (p.parent/urllib.parse.unquote(t)).exists(),t
          print("Guide, links and diagrams validated")
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python helper modules
        run: python -m compileall -q krishnabhunia
      - name: Run existing Python tests
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests

